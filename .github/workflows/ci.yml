name: CI

on:
  push:
    branches: [feature/**]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        working-directory: src
        run: terraform fmt -check

      - name: Terraform init without backend
        working-directory: src
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: src
        run: terraform validate

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r src/requirements.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Open pull request to main
        if: github.event_name == 'push' && startsWith(github.ref_name, 'feature/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh pr list --base main --head "${GITHUB_REF_NAME}" --state open --json number --jq 'length')" -gt 0 ]; then
            echo "Pull request for ${GITHUB_REF_NAME} already exists."
            exit 0
          fi
          gh pr create --base main --head "${GITHUB_REF_NAME}" --title "Promote ${GITHUB_REF_NAME} to main" --body "Automated pull request created after CI passed."