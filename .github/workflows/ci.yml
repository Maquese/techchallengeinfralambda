name: CI

on:
  push:
    branches: [feature/**, develop]
  pull_request:
    branches: [develop, main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Require feature branch for develop
        if: github.event_name == 'pull_request' && github.base_ref == 'develop' && !startsWith(github.head_ref, 'feature/')
        run: exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r src/requirements.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        working-directory: src
        run: terraform fmt -check

      - name: Terraform init without backend
        working-directory: src
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: src
        run: terraform validate